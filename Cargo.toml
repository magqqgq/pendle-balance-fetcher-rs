[package]
name = "pendle"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1.0.24", features = ["full"] }
anyhow = "1.0.99"
dotenv = "0.15.0"
futures = "0.3.31"
indexmap = { version = "2.11.0" }
lazy_static = "1.5.0"
reqwest = "0.12.23"
rust_decimal = "1.37.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.7"
